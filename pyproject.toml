[project]
name = "opspilot"
version = "0.1.0"
description = "Production AI incident-response agent portfolio project"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "prometheus-client>=0.20,<1",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  "opentelemetry-instrumentation-fastapi>=0.48b0,<1",
  "opentelemetry-instrumentation-httpx>=0.48b0,<1",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "openai>=1.50,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.3,<1",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
  "tenacity>=9,<10",
  "mcp>=1,<3",
  "kubernetes>=30,<40",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "services*"]
exclude = ["dashboard*", "eval*", "infra*", "tests*"]
namespaces = true
