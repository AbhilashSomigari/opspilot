apiVersion: v1
kind: Namespace
metadata:
  name: opspilot
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opspilot-config
  namespace: opspilot
data:
  PROMETHEUS_URL: http://prometheus:9090
  JAEGER_URL: http://jaeger:16686
  LOG_DIR: /var/log/opspilot
  LANGGRAPH_STRICT_MSGPACK: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: catalog, namespace: opspilot}
spec:
  replicas: 2
  selector: {matchLabels: {app: catalog}}
  template:
    metadata: {labels: {app: catalog}}
    spec:
      containers:
        - name: catalog
          image: REPLACE_WITH_ECR/catalog:latest
          env:
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: 'http://jaeger:4318'}
            - {name: LOG_DIR, value: '/tmp/opspilot-logs'}
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 3, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: catalog, namespace: opspilot}
spec: {selector: {app: catalog}, ports: [{port: 8000, targetPort: 8000}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: payment, namespace: opspilot}
spec:
  replicas: 2
  selector: {matchLabels: {app: payment}}
  template:
    metadata: {labels: {app: payment}}
    spec:
      containers:
        - name: payment
          image: REPLACE_WITH_ECR/payment:latest
          env:
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: 'http://jaeger:4318'}
            - {name: LOG_DIR, value: '/tmp/opspilot-logs'}
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 3, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: payment, namespace: opspilot}
spec: {selector: {app: payment}, ports: [{port: 8000, targetPort: 8000}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: checkout, namespace: opspilot}
spec:
  replicas: 2
  selector: {matchLabels: {app: checkout}}
  template:
    metadata: {labels: {app: checkout}}
    spec:
      containers:
        - name: checkout
          image: REPLACE_WITH_ECR/checkout:latest
          env:
            - {name: CATALOG_URL, value: 'http://catalog:8000'}
            - {name: PAYMENT_URL, value: 'http://payment:8000'}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: 'http://jaeger:4318'}
            - {name: LOG_DIR, value: '/tmp/opspilot-logs'}
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 3, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: checkout, namespace: opspilot}
spec: {selector: {app: checkout}, ports: [{port: 8000, targetPort: 8000}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: agent, namespace: opspilot}
spec:
  replicas: 2
  selector: {matchLabels: {app: agent}}
  template:
    metadata: {labels: {app: agent}}
    spec:
      serviceAccountName: opspilot-agent
      containers:
        - name: agent
          image: REPLACE_WITH_ECR/agent:latest
          envFrom: [{configMapRef: {name: opspilot-config}}, {secretRef: {name: opspilot-secrets}}]
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 5, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: agent, namespace: opspilot}
spec:
  type: LoadBalancer
  selector: {app: agent}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: opspilot
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: opspilot-services
        metrics_path: /metrics/
        static_configs:
          - targets: ['catalog:8000', 'payment:8000', 'checkout:8000']
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: opspilot}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.0
          args: ['--config.file=/etc/prometheus/prometheus.yml']
          ports: [{containerPort: 9090}]
          volumeMounts: [{name: config, mountPath: /etc/prometheus}]
      volumes:
        - name: config
          configMap: {name: prometheus-config}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: opspilot}
spec: {selector: {app: prometheus}, ports: [{port: 9090, targetPort: 9090}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: jaeger, namespace: opspilot}
spec:
  replicas: 1
  selector: {matchLabels: {app: jaeger}}
  template:
    metadata: {labels: {app: jaeger}}
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.20.0
          ports:
            - {containerPort: 16686}
            - {containerPort: 4318}
---
apiVersion: v1
kind: Service
metadata: {name: jaeger, namespace: opspilot}
spec:
  selector: {app: jaeger}
  ports:
    - {name: query, port: 16686, targetPort: 16686}
    - {name: otlp-http, port: 4318, targetPort: 4318}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: dashboard, namespace: opspilot}
spec:
  replicas: 1
  selector: {matchLabels: {app: dashboard}}
  template:
    metadata: {labels: {app: dashboard}}
    spec:
      containers:
        - name: dashboard
          image: REPLACE_WITH_ECR/dashboard:latest
          env: [{name: AGENT_URL, value: 'http://agent:8080'}]
          ports: [{containerPort: 3000}]
---
apiVersion: v1
kind: Service
metadata: {name: dashboard, namespace: opspilot}
spec:
  type: LoadBalancer
  selector: {app: dashboard}
  ports: [{port: 80, targetPort: 3000}]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opspilot-agent
  namespace: opspilot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opspilot-log-reader
  namespace: opspilot
rules:
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'list']
  - apiGroups: ['']
    resources: ['pods/log']
    verbs: ['get']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opspilot-log-reader
  namespace: opspilot
subjects:
  - kind: ServiceAccount
    name: opspilot-agent
    namespace: opspilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opspilot-log-reader
