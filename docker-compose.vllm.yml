services:
  vllm:
    image: vllm/vllm-openai:latest
    ipc: host
    command:
      - --model
      - ${VLLM_MODEL:-Salesforce/xLAM-2-3b-fc-r}
      - --enable-auto-tool-choice
      - --tool-call-parser
      - xlam
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    ports: ["8000:8000"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  agent:
    environment:
      LLM_PROVIDER: vllm
      VLLM_BASE_URL: http://vllm:8000/v1
      VLLM_MODEL: ${VLLM_MODEL:-Salesforce/xLAM-2-3b-fc-r}
    depends_on:
      vllm:
        condition: service_started
